[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "novaya"
dynamic = ["version"]
description = "Novayagraph: a live memory of your codebase for every coding agent."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Novaya" }]
keywords = ["novgraph", "knowledge-graph", "coding-agents", "mcp", "claude-code", "cursor"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Documentation",
]
dependencies = []

[project.urls]
Homepage = "https://trynovaya.com"
Dashboard = "https://app.trynovaya.com"

[project.scripts]
novgraph = "novaya.cli:main"

[tool.hatch.version]
path = "novaya/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["novaya"]

[tool.hatch.build.targets.sdist]
include = ["novaya", "README.md", "LICENSE", "NOTICE"]
